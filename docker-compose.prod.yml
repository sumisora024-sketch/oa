services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oa}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-admin-password}
      TZ: Asia/Tokyo
    volumes:
      - ${NIT_OA_ROOT:-/opt/nit-ao}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${NIT_OA_ROOT:-/opt/nit-ao}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    image: ${BACKEND_IMAGE:-japan-nit-oa-backend}:${BACKEND_IMAGE_TAG:-${APP_VERSION:-0.8}}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ${NIT_OA_CONFIG_DIR:-/opt/nit-ao/config}/app.env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-admin}:${MYSQL_PASSWORD:-change-admin-password}@mysql:3306/${MYSQL_DATABASE:-oa}
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost,http://127.0.0.1}
      TZ: Asia/Tokyo
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${NIT_OA_ROOT:-/opt/nit-ao}/storage:/app/backend/storage
      - ${NIT_OA_ROOT:-/opt/nit-ao}/refer:/app/refer:ro
    expose:
      - "8000"

  frontend:
    image: ${FRONTEND_IMAGE:-japan-nit-oa-frontend}:${FRONTEND_IMAGE_TAG:-${APP_VERSION:-0.8}}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
